name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: simplexml, json
          coverage: none

      - name: Empaquetado y distribucion
        # En un tag, comprueba ademas que Config::VERSION coincide con el.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            php Test/Unit/packaging.php "${GITHUB_REF_NAME}"
          else
            php Test/Unit/packaging.php
          fi

      - name: Cabeceras y resolucion de tags
        run: php Test/Unit/header-and-tags.php

      - name: Estructura del VCL generado
        run: php Test/Unit/vcl-structure.php

      - name: Diagnostico del entorno
        run: php Test/Unit/diagnostics.php

      - name: Perfiles de cache por tipo de pagina
        run: php Test/Unit/cache-profile.php

      - name: Contrato de payload con la plataforma
        run: php Test/Unit/api-payload.php

      - name: Precalentado
        run: php Test/Unit/warmup.php

      - name: Cabeceras de seguridad
        run: php Test/Unit/security-headers.php

      - name: Conflictos de speculation rules
        run: php Test/Unit/speculation-conflict.php

      - name: Huella del codigo desplegado
        run: php Test/Unit/fingerprint.php

      - name: composer validate
        run: composer validate --no-check-publish --no-check-lock
